<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buchstaben-Memory</title>
<style>
:root{font-family:system-ui,sans-serif;background:#f6f7ff;color:#27304b}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:950px;margin:auto;text-align:center}h1{font-size:clamp(2rem,6vw,3.5rem);margin:15px 0}p{line-height:1.5}.toolbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;margin:20px 0}select,button{font:inherit;border-radius:12px;padding:10px 16px;border:2px solid #6674b4;background:white}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:4px solid #ffb347}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:850px;margin:20px auto}.card{aspect-ratio:3/4;min-height:70px;display:grid;place-items:center;font-size:clamp(2rem,7vw,4.5rem);font-weight:800;color:#fff;background:#5968b3;border:3px solid #3c4a92;border-radius:15px;transition:background .15s}.card.open,.card.matched{background:#fff;color:#27304b}.card.matched{background:#d7f8dc;border-color:#4c9a5d}.card:not(.open):not(.matched)::after{content:'★';font-size:clamp(1.5rem,5vw,3rem)}.card:not(.open):not(.matched){font-size:0}.status{font-weight:700;min-height:2em}@media(min-width:650px){.board{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(min-width:850px){.board{grid-template-columns:repeat(8,minmax(0,1fr))}}
.fireworks{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:100}.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--spark);animation:burst .9s ease-out forwards}@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}75%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}}@media(prefers-reduced-motion:reduce){.spark{animation:none;display:none}}</style></head><body><main><h1>🔤 Buchstaben-Memory</h1><p>Finde immer den passenden großen und kleinen Buchstaben!</p><div class="toolbar"><label for="level">Schwierigkeit:</label><select id="level"><option value="6">Leicht · 6 Paare</option><option value="12">Mittel · 12 Paare</option><option value="26">Alle Buchstaben · 26 Paare</option></select><button id="restart">🔄 Neues Spiel</button><span id="moves">Züge: 0</span></div><p class="status" id="status" aria-live="polite">Viel Spaß!</p><div id="board" class="board" aria-label="Memory-Spielkarten"></div></main><script>
const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ';let cards=[],first=null,second=null,locked=false,moves=0,found=0,timeout=null;const board=document.getElementById('board'),level=document.getElementById('level'),status=document.getElementById('status'),moveLabel=document.getElementById('moves');function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function newGame(){if(timeout)clearTimeout(timeout);first=second=null;locked=false;moves=found=0;moveLabel.textContent='Züge: 0';status.textContent='Viel Spaß!';const count=Number(level.value);const letters=shuffle([...alphabet]).slice(0,count);cards=shuffle(letters.flatMap(letter=>[{letter,text:letter,matched:false,open:false},{letter,text:letter.toLowerCase(),matched:false,open:false}]));render()}function render(){board.replaceChildren();cards.forEach((card,index)=>{const btn=document.createElement('button');btn.className='card'+(card.open?' open':'')+(card.matched?' matched':'');btn.type='button';btn.textContent=card.open||card.matched?card.text:'';btn.setAttribute('aria-label',card.open||card.matched?'Buchstabe '+card.text:'Verdeckte Karte '+(index+1));btn.disabled=card.matched;btn.addEventListener('click',()=>flip(index));board.append(btn)})}function fireworks(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=document.createElement('div');layer.className='fireworks';layer.setAttribute('aria-hidden','true');document.body.append(layer);const colors=['#ff5577','#ffc247','#47c9e8','#8f69ff','#5ee18d'];for(let burst=0;burst<3;burst++){const x=20+Math.random()*60,y=20+Math.random()*45;for(let i=0;i<24;i++){const a=i*Math.PI/12,d=65+Math.random()*110;const spark=document.createElement('span');spark.className='spark';spark.style.left=x+'%';spark.style.top=y+'%';spark.style.setProperty('--dx',Math.cos(a)*d+'px');spark.style.setProperty('--dy',Math.sin(a)*d+'px');spark.style.setProperty('--spark',colors[(i+burst)%colors.length]);spark.style.animationDelay=(burst*110)+'ms';layer.append(spark)}}setTimeout(()=>layer.remove(),1500)}function flip(index){const c=cards[index];if(locked||c.open||c.matched)return;c.open=true;if(first===null){first=index;render();return}second=index;moves++;moveLabel.textContent='Züge: '+moves;render();if(cards[first].letter===c.letter){cards[first].matched=c.matched=true;found++;fireworks();first=second=null;status.textContent='Super! Ein Paar gefunden! ⭐';if(found===Number(level.value))status.textContent='🎉 Geschafft! Alle '+found+' Paare in '+moves+' Zügen gefunden!';render()}else{locked=true;status.textContent='Versuch es nochmal!';timeout=setTimeout(()=>{cards[first].open=false;cards[second].open=false;first=second=null;locked=false;timeout=null;render()},1100)}}document.getElementById('restart').addEventListener('click',newGame);level.addEventListener('change',newGame);newGame();
</script></body></html>
