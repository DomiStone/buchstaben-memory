<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buchstaben-Memory</title>
<style>
:root{font-family:system-ui,sans-serif;background:#f6f7ff;color:#27304b}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:950px;margin:auto;text-align:center}h1{font-size:clamp(2rem,6vw,3.5rem);margin:15px 0}p{line-height:1.5}.toolbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;margin:20px 0}select,button{font:inherit;border-radius:12px;padding:10px 16px;border:2px solid #6674b4;background:white}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:4px solid #ffb347}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:850px;margin:20px auto}.card{aspect-ratio:3/4;min-height:70px;display:grid;place-items:center;font-size:clamp(2rem,7vw,4.5rem);font-weight:800;color:#fff;background:#5968b3;border:3px solid #3c4a92;border-radius:15px;transition:background .15s}.card.open,.card.matched{background:#fff;color:#27304b}.card.matched{background:#d7f8dc;border-color:#4c9a5d}.card:not(.open):not(.matched)::after{content:'★';font-size:clamp(1.5rem,5vw,3rem)}.card:not(.open):not(.matched){font-size:0}.status{font-weight:700;min-height:2em}@media(min-width:650px){.board{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(min-width:850px){.board{grid-template-columns:repeat(8,minmax(0,1fr))}}
.fireworks{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}.spark{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--spark);box-shadow:0 0 10px 3px var(--spark);animation:burst 1.4s cubic-bezier(.1,.5,.3,1) forwards}@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}25%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15);opacity:0}}</style></head><body><main><h1>🔤 Buchstaben-Memory</h1><p>Finde immer den passenden großen und kleinen Buchstaben!</p><div class="toolbar"><label for="level">Schwierigkeit:</label><select id="level"><option value="6">Leicht · 6 Paare</option><option value="12">Mittel · 12 Paare</option><option value="26">Alle Buchstaben · 26 Paare</option></select><button id="sound" type="button" aria-pressed="true">🔊 Ton an</button><button id="restart">🔄 Neues Spiel</button><span id="moves">Züge: 0</span></div><p class="status" id="status" aria-live="polite">Viel Spaß!</p><div id="board" class="board" aria-label="Memory-Spielkarten"></div></main><script>
const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ';let cards=[],first=null,second=null,locked=false,moves=0,found=0,timeout=null;const board=document.getElementById('board'),level=document.getElementById('level'),status=document.getElementById('status'),moveLabel=document.getElementById('moves');function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function newGame(){if(timeout)clearTimeout(timeout);first=second=null;locked=false;moves=found=0;moveLabel.textContent='Züge: 0';status.textContent='Viel Spaß!';const count=Number(level.value);const letters=shuffle([...alphabet]).slice(0,count);cards=shuffle(letters.flatMap(letter=>[{letter,text:letter,matched:false,open:false},{letter,text:letter.toLowerCase(),matched:false,open:false}]));render()}function render(){board.replaceChildren();cards.forEach((card,index)=>{const btn=document.createElement('button');btn.className='card'+(card.open?' open':'')+(card.matched?' matched':'');btn.type='button';btn.textContent=card.open||card.matched?card.text:'';btn.setAttribute('aria-label',card.open||card.matched?'Buchstabe '+card.text:'Verdeckte Karte '+(index+1));btn.disabled=card.matched;btn.addEventListener('click',()=>flip(index));board.append(btn)})}let audioCtx=null;let soundOn=true;function applause(){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=audioCtx||new C();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;for(let i=0;i<22;i++){const t=now+i*.055;const len=Math.floor(audioCtx.sampleRate*.045);const buffer=audioCtx.createBuffer(1,len,audioCtx.sampleRate);const data=buffer.getChannelData(0);for(let j=0;j<len;j++)data[j]=(Math.random()*2-1)*(1-j/len);const source=audioCtx.createBufferSource();source.buffer=buffer;const filter=audioCtx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=850+Math.random()*950;const gain=audioCtx.createGain();gain.gain.value=.045;source.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);source.start(t)}for(let i=0;i<3;i++){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=now+.1+i*.16;osc.type='triangle';osc.frequency.setValueAtTime(440+i*90,t);osc.frequency.exponentialRampToValueAtTime(650+i*110,t+.19);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.09,t+.03);gain.gain.exponentialRampToValueAtTime(.0001,t+.24);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.25)}}catch(e){console.warn('Sound unavailable',e)}}function fireworks(){const layer=document.createElement('div');layer.style.cssText='position:fixed;inset:0;z-index:999999;pointer-events:none;overflow:hidden';document.body.appendChild(layer);const colors=['#ff315a','#ffd000','#00cfff','#8a5cff','#00e88b'];for(let n=0;n<100;n++){const dot=document.createElement('span');const angle=Math.random()*6.283;const dist=60+Math.random()*Math.min(innerWidth,innerHeight)*.55;dot.style.cssText='position:absolute;left:50%;top:43%;width:10px;height:10px;border-radius:50%;background:'+colors[n%colors.length]+';box-shadow:0 0 10px currentColor;opacity:1;transition:transform 1.4s ease-out,opacity 1.4s ease-out';layer.appendChild(dot);requestAnimationFrame(()=>{dot.style.transform='translate('+Math.cos(angle)*dist+'px,'+Math.sin(angle)*dist+'px)';dot.style.opacity='0'})}setTimeout(()=>layer.remove(),1700)}function flip(index){const c=cards[index];if(locked||c.open||c.matched)return;c.open=true;if(first===null){first=index;render();return}second=index;moves++;moveLabel.textContent='Züge: '+moves;render();if(cards[first].letter===c.letter){cards[first].matched=c.matched=true;found++;fireworks();applause();first=second=null;status.textContent='Super! Ein Paar gefunden! ⭐';if(found===Number(level.value))status.textContent='🎉 Geschafft! Alle '+found+' Paare in '+moves+' Zügen gefunden!';render()}else{locked=true;status.textContent='Versuch es nochmal!';timeout=setTimeout(()=>{cards[first].open=false;cards[second].open=false;first=second=null;locked=false;timeout=null;render()},1100)}}document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;const b=document.getElementById('sound');b.textContent=soundOn?'🔊 Ton an':'🔇 Ton aus';b.setAttribute('aria-pressed',String(soundOn))});document.getElementById('restart').addEventListener('click',newGame);level.addEventListener('change',newGame);newGame();
</script></body></html>
